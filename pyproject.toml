[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mybootstrap_mvc_fastapi_itskovichanton"
version = "1.0.0"
authors = [
    { name = "Anton Itskovich", email = "itskovichae@gmail.com" },
]
description = "My bootstrap app engine mvc (fastapi) implementation"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "dacite",
    "fastapi",
    "pydantic",
    "requests",
    "requests-toolbelt",
    "starlette",
    "xsdata",
]

[project.urls]
"Homepage" = "https://github.com/itskovichanton/pymvc-fastapi"

[tool.hatch.build.targets.wheel]
packages = ["src"]
